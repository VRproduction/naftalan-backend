<section id="contact" class="contact">
    <div class="container">
        <div class="section-header">
            <h2>Bizimlə Əlaqə</h2>
            <p>Sual və təklifləriniz üçün bizimlə əlaqə saxlayın</p>
        </div>
        
        <div class="contact-container">
            <div class="contact-info">
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="info-content">
                        <h3>Telefon</h3>
                        <p>+994 50 123 45 67</p>
                        <p>+994 50 765 43 21</p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="info-content">
                        <h3>E-poçt</h3>
                        <p>info@naftalankurortu.az</p>
                        <p>reservation@naftalankurortu.az</p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="info-content">
                        <h3>Ünvan</h3>
                        <p>Naftalan şəhəri, Azərbaycan</p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="info-content">
                        <h3>İş Saatları</h3>
                        <p>Bazar ertəsi - Şənbə: 09:00 - 18:00</p>
                        <p>Bazar: 10:00 - 16:00</p>
                    </div>
                </div>
            </div>
            <form class="contact-form">
                <div class="form-row">
                    <div class="form-control">
                        <label for="name">Adınız</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-control">
                        <label for="email">E-poçt</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                <div class="form-control">
                    <label for="subject">Mövzu</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-control">
                    <label for="message">Mesajınız</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Göndər</button>
            </form>
        </div>
    </div>
</section>
